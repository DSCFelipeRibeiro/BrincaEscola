name: Promote to PROD

on:
  workflow_dispatch:
    inputs:
      backup_reference:
        description: Reference for the verified private local and remote backups required by PROD/AGENTS.md
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout approved main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Validate backup reference
        env:
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
        run: test -n "$BACKUP_REFERENCE"
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Upload candidate release
        env:
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          RELEASE_DIR="/home/ubuntu/brincaescola-prod-releases/$RELEASE_ID"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$RELEASE_DIR'"
          rsync -az \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='__pycache__/' \
            -e 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
            DEV/app/ "$DEPLOY_USER@$DEPLOY_HOST:$RELEASE_DIR/"
      - name: Compile, activate, and restart PROD
        env:
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; release='/home/ubuntu/brincaescola-prod-releases/$RELEASE_ID'; python3 -m py_compile \"\$release/app.py\"; ln -sfn \"\$release\" /home/ubuntu/brincaescola-prod.next; mv -Tf /home/ubuntu/brincaescola-prod.next /home/ubuntu/brincaescola-prod; sudo systemctl restart brincaescola-prod.service; sudo systemctl is-active --quiet brincaescola-prod.service"
